<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my naimal facts</title>
    <style>
        /* page background - sets the color and font for the whole page */
        body {
            background-color: navy;
            font-family: inherit;
        }

        /* box model- width sets the content area padding pushes the text away from the edges broder draws a visible frame around the fact-file away from the screen edges*/
        .fact-file {
            background-color: coral;
            color: blueviolet;
            width: 250px;
            border: 8px solid yellow;
            padding: 40px;
            margin: 30px;

        }

        /*animal-name - forest green so it standsout */
        .animal-name {
            color: chartreuse;
            font-size: 22px;


        }

        /* detail rows - dark text om the light background */
        .detail {
            color: darkgreen;

        }

        /*cool fact - orange and italic to make it special */
        .cool-fact {
            color: aquamarine;
            font-style: italic;
        }
        .kimjung-un{
            background-color:azure;
            color:beige;
            width: 250px;
            border: 34px solid salmon;
            margin:30px;
            padding:44px;
        }

    </style>

</head>

<body>
    <div class="fact-file">
        <h2 class="animal-name">snow leopard</h2>
        <p class="detail">big cats</p>
        <p class="detail">lives in mountain range</p>
        <p class="detail">eats meat</p>
        <p class="cool-fact">color white</p>
    </div>
    <div class="kimjung-un">
        <h2 class="animal-name">snow leopard</h2>
        <p class="detail">big cats</p>
        <p class="detail">lives in mountain range</p>
        <p class="detail">eats meat</p>
        <p class="cool-fact">color white</p>
    </div>

</body>

</html>
