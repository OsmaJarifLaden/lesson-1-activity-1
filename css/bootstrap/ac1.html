<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

</head>

<body>
    <h1>my hooby card</h1>
    <!--STEP 2 - container keeps the layout a neat and centred-->
    <div class="container">

        <!--STEP 3 - row holds all the columns in one horizontal line-->
        <div class="row">
            <!--STEP 4 - col-12:full width on phones col m-d-6: half width no tablets col-lg-4: one-third on desktops-->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>drawing</h3>
                    <p>i love sketching animals and comic characters</p>
                </div>
            </div>

        </div>
    </div>



        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>

</html>
