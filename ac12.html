<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my unhealthy menu:</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: Georgia, 'Times New Roman', Times, serif;
            padding: 30px;
        }

        h1 {
            color: aqua;
        }

        /*sibling selector- styles the paragraph right after h1 */
        h1+p {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: Georgia, 'Times New Roman', Times, serif;
            padding: 30px;
            color: brown;
            display: inline-block;
        }

        ul {
            padding: 0cqmin;
            margin-top: 10px;
        }

        /*child-selector - styles the direct li of children of ul*/
        ul>li {
            list-style: circle;
            font-size: 18px;
            font-weight: 18px;
            color:blueviolet;
            padding: 30px;
            margin: 6px auto;
            background-color:chocolate;
            width: 260px;
            border-radius: 8px;
                }
        /*nth-child - highlights the 3rd item as pasta*/
        ul li:nth-child(3) {
            background-color: blanchedalmond;
            color:chartreuse;
        }
        .desc {
            color:cornsilk;
            margin-top: 20px;
            max-width: 12px;
            font-size: 15px;
            margin-left: auto;
            margin-right: auto; 
        }
        /*first letter - makes the letter beg and bold*/
        .desc::first letter {
            font-size: 19px;
            color: aqua;
            font-weight: bold;
        }
        .links {margin-top: 25px;}
        /* hover effect - links glow when mouse moves over them */
        a {
            color:darkkhaki;
            text-decoration:wavy;
            font-size: 15px;
            margin:0 12px;
            border: 2px salmon;
            border-radius: 8px;
        }
        a:hover{ 
        background-color:darkcyan;
        color:brown
        }
    </style>
</head>

<body>
    <h1>party menu:</h1>
    <p>pick ur favourtie dish and dig in!</p>
    <ul>
        <li>burger</li>
        <li>pizza</li>
        <li>pasta</li>
        <li>behl puri</li>
    </ul>
    <p class="desc">every dish on this menu is NOT HEALTHY it contains fats</p>

    <div class="links">
        <a herf="#">order now></a>
        <a herf="#">see more></a>
    </div>
</body>

</html>
